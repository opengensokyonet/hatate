[workspace]
members = [
    "crates/hatate_qpack",
    "crates/hatate_wire",
    "crates/hatate_wire_datagram",
    "crates/hatate_wire_extended_connect",
    "crates/hatate_wire_qpack",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
bytes = { version = "1.12.1", default-features = false }
frunk_core = { version = "=0.5.0", default-features = false }
pin-project-lite = "0.2.17"
snafu = { version = "0.9.2", git = "https://github.com/opengensokyonet/snafu", rev = "03cb8d2e52a3b0b33a39cc3d4ce8a7075fa4ab58", default-features = false, features = ["rust_1_81"] }
nitori_io = { version = "0.0.0", git = "https://github.com/opengensokyonet/nitori", rev = "cad7dadafe0af6c6265ea684d2549fbb78b55aca", default-features = false }
nitori_call = { version = "0.0.0", git = "https://github.com/opengensokyonet/nitori", rev = "cad7dadafe0af6c6265ea684d2549fbb78b55aca", default-features = false }
sakuya_var_int = { version = "0.0.0", git = "https://github.com/opengensokyonet/sakuya", rev = "39cb9183c86b24bc0addae676a1f74ea8b831e60" }
hatate_wire = { path = "crates/hatate_wire" }
hatate_wire_qpack = { path = "crates/hatate_wire_qpack" }
hatate_wire_extended_connect = { path = "crates/hatate_wire_extended_connect" }
