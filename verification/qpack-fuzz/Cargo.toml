[package]
name = "hatate-qpack-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[package.metadata]
cargo-fuzz = true

[workspace]
resolver = "3"

[dependencies]
nitori_io = { version = "0.0.0", git = "https://github.com/opengensokyonet/nitori", rev = "2054ef25fc0a19da555c8069784e70427879841a", default-features = false }
nitori_call = { version = "0.0.0", git = "https://github.com/opengensokyonet/nitori", rev = "2054ef25fc0a19da555c8069784e70427879841a", default-features = false }
hatate_qpack = { path = "../../crates/hatate_qpack" }
libfuzzer-sys = "0.4.13"
bytes = { version = "1.12.1", default-features = false }

[[bin]]
name = "integer"
path = "fuzz_targets/integer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "huffman"
path = "fuzz_targets/huffman.rs"
test = false
doc = false
bench = false

[[bin]]
name = "field_line"
path = "fuzz_targets/field_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "static_section"
path = "fuzz_targets/static_section.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decoder_instruction"
path = "fuzz_targets/decoder_instruction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encoder_instruction"
path = "fuzz_targets/encoder_instruction.rs"
test = false
doc = false
bench = false
