[package]
name = "hatate-qpack-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 OR MIT"

[package.metadata]
cargo-fuzz = true

[workspace]
resolver = "3"

[dependencies]
nitori_io = { version = "0.0.0", git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b", default-features = false }
nitori_call = { version = "0.0.0", git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b", default-features = false }
nitori_codec = { version = "0.0.0", git = "https://github.com/opengensokyonet/nitori", rev = "0de5f36b921c891815d138226c6180c6aa70953b", default-features = false }
hatate_qpack = { path = "../../crates/hatate_qpack" }
hatate_wire = { path = "../../crates/hatate_wire" }
hatate_wire_datagram = { path = "../../crates/hatate_wire_datagram" }
hatate_wire_extended_connect = { path = "../../crates/hatate_wire_extended_connect" }
frunk_core = { version = "=0.5.0", default-features = false }
sakuya_var_int = { version = "0.0.0", git = "https://github.com/opengensokyonet/sakuya", rev = "39c4bc0fad1f032be7d00cc6f5b5c14585b19eb9" }
libfuzzer-sys = "0.4.13"
bytes = { version = "1.12.1", default-features = false }

[[bin]]
name = "integer"
path = "fuzz_targets/integer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "huffman"
path = "fuzz_targets/huffman.rs"
test = false
doc = false
bench = false

[[bin]]
name = "field_line"
path = "fuzz_targets/field_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "static_section"
path = "fuzz_targets/static_section.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decoder_instruction"
path = "fuzz_targets/decoder_instruction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encoder_instruction"
path = "fuzz_targets/encoder_instruction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_frames"
path = "fuzz_targets/wire_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_streams"
path = "fuzz_targets/wire_streams.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_received_frames"
path = "fuzz_targets/wire_received_frames.rs"
test = false
doc = false
bench = false
